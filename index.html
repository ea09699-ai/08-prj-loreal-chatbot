<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>L'Oréal Beauty Advisor</title>
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet"
    />
    <!--
      Monotype's L'Oréal review specifies Bauer Bodoni and ITC Avant Garde.
      Bodoni Moda and Josefin Sans are the free webfont stand-ins.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500;6..96,700&family=Josefin+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="page-wrapper">
      <header class="site-header">
        <p class="logo" aria-label="L'Oréal Paris">
          <span class="logo-mark">L'ORÉAL</span>
          <span class="logo-sub">PARIS</span>
        </p>
        <p class="tagline">Because you're worth it.</p>
        <h1 class="site-title">Beauty Advisor</h1>
      </header>
      <main>
        <section class="chatbox" aria-label="L'Oréal beauty chat">
          <div id="chatWindow" class="chat-window" aria-live="polite"></div>
          <form id="chatForm" class="chat-form">
            <label for="userInput" class="visually-hidden">Message</label>
            <input
              id="userInput"
              name="userInput"
              type="text"
              placeholder="Ask about L'Oréal makeup, skincare, haircare, or fragrance…"
              autocomplete="off"
              required
            />
            <button type="submit" id="sendBtn" aria-label="Send">
              <span class="material-icons" aria-hidden="true">send</span>
            </button>
          </form>
        </section>
      </main>
      <footer class="site-footer">
        <p>&copy; 2025 L'Oréal. All rights reserved.</p>
        <nav>
          <a href="https://www.loreal.com/en/privacy-policy/">Privacy Policy</a>
          <a href="https://www.loreal.com/en/terms-of-use/">Terms of Use</a>
          <a href="https://www.loreal.com/en/contact-us/">Contact</a>
        </nav>
      </footer>
    </div>
    <script src="script.js"></script>
  </body>
</html>
